<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Online Advent Calendar 2025</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<link href="pof25.css" rel="stylesheet" type="text/css">
</head>

<body>
<div class="container">
    <div id="flash"></div>
</div>

<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
    autoplay: "on",
    splashScreen: false,
    unmuteOverlay: "hidden"
};

window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    const flashDiv = document.getElementById("flash");
    flashDiv.appendChild(player);
    player.load("calendar.swf?nocache=" + Date.now());

    const resizePlayer = () => {
        const width = flashDiv.clientWidth;
        const height = width * 400 / 550;
        player.style.width = width + "px";
        player.style.height = height + "px";
    };

    resizePlayer();

    const resizeObserver = new ResizeObserver(resizePlayer);
    resizeObserver.observe(flashDiv);
});
</script>

</html>

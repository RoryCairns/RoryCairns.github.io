<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Online Advent Calendar 2025</title>
	
	<meta content="Post Office Family Online Advent Calendar 2025" property="og:title" />
	<meta content="Return daily to open the 24 P.O. boxes in Poshote Mills!" property="og:description" />
	<meta content="https://irns.uk/pof/25" property="og:url" />
	<meta content="https://irns.uk/pof/25/embed.png" property="og:image" />
	
	<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
	<link href="pof25.css" rel="stylesheet" type="text/css">
	<link rel="icon" href="favicon.ico">
	
</head>

<body>
	
<script>
	var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|BB|PlayBook|IEMobile|Windows Phone|Kindle|Silk|Opera Mini/i.test(navigator.userAgent);
</script>
	
<div class="container">
    <div id="flash"></div>
</div>

<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
    autoplay: "on",
    splashScreen: false,
    unmuteOverlay: "hidden"
};

window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    const flashDiv = document.getElementById("flash");
    flashDiv.appendChild(player);
    player.load({
		url: "calendar.swf?nocache=" + Date.now(),
		parameters: {
			isMobile: isMobile ? "true" : "false"
		}
	});

    const resizePlayer = () => {
        const width = flashDiv.clientWidth;
        const height = width * 400 / 550;
        player.style.width = width + "px";
        player.style.height = height + "px";
    };

    resizePlayer();

    const resizeObserver = new ResizeObserver(resizePlayer);
    resizeObserver.observe(flashDiv);
});
</script>

</html>
